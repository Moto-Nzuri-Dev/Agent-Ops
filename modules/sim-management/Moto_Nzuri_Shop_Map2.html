<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moto Nzuri Shop Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#f5f6f4; --panel:#ffffff; --fg:#1b2a33; --muted:#5d6b74; --line:#dfe4e1; --accent:#12355b;
  --ok:#1f9d6b; --check:#d99a00; --wrong:#d6402f; --missing:#7a8794; --chip:#eef1ef;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181d;--panel:#18232a;--fg:#e6ecef;--muted:#9aa9b2;--line:#2a3943;--accent:#8fb8e8;--chip:#202e36;color-scheme:dark}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-size:14px}
.app{display:grid;grid-template-columns:380px 1fr;height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
header{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0 0 2px;color:var(--accent);letter-spacing:.2px}
header p{margin:0;color:var(--muted);font-size:12px;line-height:1.4}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 16px 4px}
.stat{border:1px solid var(--line);border-radius:6px;padding:6px 4px;text-align:center;cursor:pointer;background:var(--chip);font:inherit;color:inherit}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.stat[aria-pressed="true"]{outline:2px solid var(--accent)}
.stat i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 16px 8px}
.filters input,.filters select{width:100%;box-sizing:border-box;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
.filters input{grid-column:1/-1}
.bar{display:flex;justify-content:space-between;align-items:center;padding:0 16px 6px;color:var(--muted);font-size:12px}
.bar button{font:inherit;font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--chip);color:var(--fg);cursor:pointer}
#list{overflow:auto;flex:1;min-height:0;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:12px 1fr;gap:8px;padding:9px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover,.item:focus-visible{background:var(--chip);outline:none}
.dot{width:10px;height:10px;border-radius:50%;margin-top:4px}
.item .t{font-weight:600}
.item .s{color:var(--muted);font-size:12px}
.item .w{font-size:12px;margin-top:2px}
.detail{grid-column:2;font-size:12px;color:var(--muted);margin-top:4px}
#map{height:100%;min-height:320px;background:#cfd8dc}
.pop{min-width:240px;max-width:300px;font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1b2a33}
.pop h3{margin:0 0 2px;font-size:15px}
.pop .loc{color:#5d6b74;margin-bottom:6px}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600;color:#fff;margin-right:4px}
.alert{border-radius:6px;padding:6px 8px;margin:6px 0;font-size:12px}
.alert.wrong{background:#fde8e5;color:#8f2418}.alert.check{background:#fff3d1;color:#7a5600}.alert.missing{background:#e9edf0;color:#3d4a53}.alert.ok{background:#e1f4ec;color:#146a49}
.pop dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0}
.pop dt{color:#5d6b74}.pop dd{margin:0;font-variant-numeric:tabular-nums}
.pop .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pop a,.pop button{font:inherit;font-size:12px;padding:4px 8px;border:1px solid #c5ced3;border-radius:6px;background:#f3f6f7;color:#12355b;text-decoration:none;cursor:pointer}
.legend{position:absolute;z-index:500;left:10px;bottom:24px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;line-height:1.7}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.mapwrap{position:relative;min-width:0}
.hint{position:absolute;z-index:500;top:10px;left:50%;transform:translateX(-50%);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12px;max-width:80%}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:52vh 48vh}
  .mapwrap{order:-1}
  aside{border-right:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<div class="app">
<aside>
  <header>
    <h1>Moto Nzuri shop map</h1>
    <p><a href="/sim-management/" style="display:inline-block;margin:0 0 8px;padding:5px 9px;border-radius:6px;background:#12355b;color:white;text-decoration:none;font-weight:600">Open SIM Management →</a><br>All shops on one map to catch wrong coordinates. Red = clearly wrong, amber = please check, grey = no coordinates. Updated 4 Nov 2026.</p>
  </header>
  <div class="stats" id="stats"></div>
  <div class="filters">
    <input id="q" type="search" placeholder="Search shop, location, MN or KP number" aria-label="Search shops">
    <select id="loc" aria-label="Location"><option value="">All locations</option></select>
    <select id="st" aria-label="Status"><option value="">All statuses</option><option>Selling</option><option>Not selling</option><option>Decommissioned / Rent</option></select>
  </div>
  <div class="bar"><span id="count"></span><button id="dl" type="button">Download flagged list (CSV)</button></div>
  <div id="list" tabindex="0"></div>
</aside>
<div class="mapwrap">
  <div id="map"></div>
  <div class="hint" id="hint">Click anywhere on the map to read its coordinates.</div>
  <div class="legend"><div><i style="background:var(--ok)"></i>Looks right</div><div><i style="background:var(--check)"></i>Check</div><div><i style="background:var(--wrong)"></i>Wrong (suggested spot shown)</div></div>
</div>
</div>

const $=id=>document.getElementById(id);
const el=(t,props,...kids)=>{const e=document.createElement(t);if(props)for(const k in props){if(k==='class')e.className=props[k];else if(k==='text')e.textContent=props[k];else if(k==='style')e.style.cssText=props[k];else e.setAttribute(k,props[k])}for(const c of kids)if(c!=null)e.append(c);return e};
const fmt=v=>v==null?'-':v;
let sevFilter='';
const mapEl=$('map');

let map,group,markers=new Map();
if(typeof L!=='undefined'){
  map=L.map('map',{zoomControl:true}).setView([-1.28,36.87],11);
  const layers={
    'Street map (OSM France)':L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png',{maxZoom:19,subdomains:'abc',attribution:'&copy; OpenStreetMap contributors, tiles by OSM France'}),

  };
  const names=Object.keys(layers);let cur=0,errs=0;
  layers[names[0]].addTo(map);
  L.control.layers(layers,null,{collapsed:false}).addTo(map);
  names.forEach((n,i)=>layers[n].on('tileerror',()=>{

}
function copyBtn(text){const b=el('button',{type:'button',text:'Copy'});b.onclick=()=>{const done=()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1500)};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,()=>window.prompt('Copy:',text));else window.prompt('Copy:',text)};return b}
function popup(r){
  const d=el('div',{class:'pop'});
  d.append(el('h3',{text:r.name}),el('div',{class:'loc',text:(r.loc||'')+(r.n?'  ·  No. '+r.n:'')}));
  const pills=el('div');pills.append(el('span',{class:'pill',style:'background:'+STCOL[r.status],text:r.status}));
  if(r.top)pills.append(el('span',{class:'pill',style:'background:#12355b',text:'Top seller '+r.top}));
  d.append(pills);
  if(r.issues.length||r.sev!=='ok'){const a=el('div',{class:'alert '+r.sev});a.append(el('b',{text:LABEL[r.sev]+': '}));a.append(r.issues.join('. ')||'');d.append(a)}
  else d.append(el('div',{class:'alert ok',text:'Coordinates look right'}));
  const dl=el('dl');
  const add=(k,v)=>{dl.append(el('dt',{text:k}),el('dd',{text:fmt(v)}))};

  add('Branding / Tablet / Controller',[r.brand,r.tab,r.ctl].map(fmt).join(' / '));

  if(r.reason)add('Reason',r.reason);
  if(r.com)add('Comments',r.com);
  d.append(dl);

  if(r.lat!=null){row.append(copyBtn(r.lat.toFixed(6)+', '+r.lon.toFixed(6)),el('a',{href:'https://www.google.com/maps?q='+r.lat+','+r.lon,target:'_blank',rel:'noopener',text:'Google Maps'}),el('a',{href:'https://www.google.com/maps/dir/?api=1&destination='+r.lat+','+r.lon,target:'_blank',rel:'noopener',text:'Directions'}))}

  d.append(row);return d;

function visible(){
  const q=$('q').value.trim().toLowerCase(),loc=$('loc').value,st=$('st').value;
  return DATA.filter(r=>(!sevFilter||r.sev===sevFilter)&&(!loc||r.loc.toLowerCase()===loc)&&(!st||r.status===st)&&(!q||[r.name,r.loc,r.mn,r.kp,r.phone].some(x=>x&&String(x).toLowerCase().includes(q))));
}
const order={wrong:0,check:1,missing:2,ok:3};
function render(fit){
  const rows=visible().sort((a,b)=>order[a.sev]-order[b.sev]||a.loc.localeCompare(b.loc)||a.name.localeCompare(b.name));
  $('count').textContent=rows.length+' of '+DATA.length+' shops';
  const list=$('list');list.textContent='';

  rows.forEach(r=>{
    const it=el('div',{class:'item',tabindex:'0',role:'button'});
    it.append(el('span',{class:'dot',style:'background:'+COL[r.sev]}));
    const b=el('div');b.append(el('div',{class:'t',text:r.name}),el('div',{class:'s',text:r.loc+'  ·  '+r.status}));
    if(r.issues.length)b.append(el('div',{class:'w',text:r.issues[0]}));
    it.append(b);
    const go=()=>{
      if(r.lat!=null&&map){map.flyTo([r.lat,r.lon],17,{duration:.8});const m=markers.get(r);if(m)setTimeout(()=>m.openPopup(),850)}
      else if(!map||r.lat==null){let dt=it.querySelector('.detail');if(dt){dt.remove();return}dt=el('div',{class:'detail'});dt.append(popup(r));it.append(dt)}
    };
    it.onclick=e=>{if(e.target.closest('a,button'))return;go()};it.onkeydown=e=>{if(e.key==='Enter')go()};
    frag.append(it);
  });
  list.append(frag);
  if(map){
    group.clearLayers();markers=new Map();const pts=[];
    rows.forEach(r=>{
      if(r.lat==null)return;
      const m=L.circleMarker([r.lat,r.lon],{radius:r.sev==='ok'?6:9,color:'#ffffff',weight:2,fillColor:COL[r.sev],fillOpacity:.95});
      m.bindPopup(()=>popup(r),{maxWidth:320});m.addTo(group);markers.set(r,m);pts.push([r.lat,r.lon]);
    });
    if(fit&&pts.length)map.fitBounds(L.latLngBounds(pts),{padding:[30,30],maxZoom:15});
  }
}
function stats(){
  const c={ok:0,check:0,wrong:0,missing:0};DATA.forEach(r=>c[r.sev]++);
  const box=$('stats');box.textContent='';
  [['wrong','Wrong'],['check','Check'],['missing','Missing'],['ok','OK']].forEach(([k,t])=>{
    const b=el('button',{class:'stat',type:'button','aria-pressed':'false'});
    b.append(el('b',{text:c[k]}));const s=el('span');s.append(el('i',{style:'background:'+COL[k]}),t);b.append(s);

    box.append(b);
  });
}
const locs=[...new Set(DATA.map(r=>r.loc.toLowerCase()))].sort();
locs.forEach(l=>{const label=DATA.find(r=>r.loc.toLowerCase()===l).loc;$('loc').append(el('option',{value:l,text:label}))});

$('dl').onclick=()=>{
  const rows=DATA.filter(r=>r.sev!=='ok'&&r.sev!=='');
  const head=['No.','Shop','Location','Status','Result','Recorded latitude','Recorded longitude','Suggested latitude','Suggested longitude','Problem'];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csv=[head.map(q).join(',')].concat(rows.map(r=>[r.n,r.name,r.loc,r.status,LABEL[r.sev],r.rawLat,r.rawLon,r.fixed?r.lat:'',r.fixed?r.lon:'',r.issues.join('. ')].map(q).join(','))).join('\r\n');
  const a=el('a',{href:URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'})),download:'shops_to_check_coordinates.csv'});document.body.append(a);a.click();a.remove();
